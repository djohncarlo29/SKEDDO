name: Flutter iOS Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'

      - name: Install Dependencies
        working-directory: artifacts/smart-scheduler
        run: flutter pub get

      - name: Prepare unsigned iOS build
        working-directory: artifacts/smart-scheduler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          contents = project.read_text()
          marker = 'DEVELOPMENT_TEAM = 0000000000;'
          if marker not in contents:
              contents = contents.replace(
                  '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";',
                  '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";\n'
                  f'{marker}',
              )
              project.write_text(contents)
          PY

      - name: Build iOS Workspace
        working-directory: artifacts/smart-scheduler
        run: flutter build ios --release --no-codesign

      - name: Package into IPA
        run: |
          rm -rf artifacts/smart-scheduler/Payload artifacts/smart-scheduler/FlutterApp.ipa
          mkdir -p artifacts/smart-scheduler/Payload
          cp -R artifacts/smart-scheduler/build/ios/iphoneos/Runner.app \
            artifacts/smart-scheduler/Payload/
          cd artifacts/smart-scheduler
          zip -qry FlutterApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-ipa
          path: artifacts/smart-scheduler/FlutterApp.ipa