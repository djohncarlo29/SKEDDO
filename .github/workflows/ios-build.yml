name: Flutter iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'

      - name: Install Dependencies
        working-directory: artifacts/smart-scheduler
        run: flutter pub get

      - name: Build iOS Workspace
        working-directory: artifacts/smart-scheduler
        run: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons

      - name: Package into IPA
        run: |
          set -euo pipefail
          rm -rf artifacts/smart-scheduler/Payload artifacts/smart-scheduler/FlutterApp.ipa
          mkdir -p artifacts/smart-scheduler/Payload
          test -d artifacts/smart-scheduler/build/ios/iphoneos/Runner.app
          cp -R artifacts/smart-scheduler/build/ios/iphoneos/Runner.app \
            artifacts/smart-scheduler/Payload/
          cd artifacts/smart-scheduler
          zip -qry FlutterApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios-ipa
          path: artifacts/smart-scheduler/FlutterApp.ipa