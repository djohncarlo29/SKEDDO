workflows:
  ios-release:
    name: SKEDDO iOS release
    working_directory: artifacts/smart-scheduler
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: 3.35.7
      xcode: latest
      cocoapods: default
      groups:
        # Create these groups in Codemagic and add the values there.
        # app_store_connect:
        #   APP_STORE_CONNECT_PRIVATE_KEY
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_ISSUER_ID
        # shorebird:
        #   SHOREBIRD_TOKEN
        # project:
        #   PROXY_BASE_URL
        - app_store_connect
        - shorebird
        - project
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.smartscheduler.smartScheduler

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Configure iOS signing
        script: |
          xcode-project use-profiles

      - name: Install Shorebird
        script: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          export PATH="$HOME/.shorebird/bin:$PATH"
          shorebird doctor

      - name: Build signed Shorebird IPA
        script: |
          set -euo pipefail
          export PATH="$HOME/.shorebird/bin:$PATH"

          if [[ -z "${SHOREBIRD_TOKEN:-}" ]]; then
            echo "SHOREBIRD_TOKEN is required for the native iOS release."
            exit 1
          fi

          shorebird release ios \
            --artifact ipa \
            -- \
            --dart-define=PROXY_BASE_URL="${PROXY_BASE_URL:-}"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true