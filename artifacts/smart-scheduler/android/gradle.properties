# Keep release builds stable in the Replit container. The container has no swap
# and its shared-memory filesystem can trigger OpenJDK SIGBUS crashes when
# Gradle uses the default compiler/worker fan-out.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -XX:+PerfDisableSharedMem -XX:-UsePerfData -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Djava.io.tmpdir=/home/runner/workspace/.cache/gradle-tmp
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=false
# Explicitly exclude Flutter's libs.jar from Jetifier transforms.
# Even with enableJetifier=false, AGP 8.9.x still registers JetifyTransform
# for file-based dependencies and tries to process libs.jar before Flutter
# generates it, causing a build failure.  This ignorelist is the escape hatch.
android.jetifier.ignorelist=libs
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# KGP 2.1 (bundled with Flutter 3.44.9) made the JVM-target consistency check
# an error. Plugin packages like flutter_onnxruntime and tflite_flutter declare
# Kotlin JVM 17 but leave Java at 11; downgrade to WARNING so the build proceeds.
# The actual compiled bytecode is still JVM 17 (from the Kotlin side) which is
# correct for the JDK 17 runtime we use.
kotlin.jvm.target.validation.mode=WARNING
