name: smart_scheduler
description: "SKEDDO"
publish_to: 'none'

version: 1.0.0+63

environment:
  # Flutter 3.44.2 provides Dart 3.12.2 required by a package dependency.
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.2'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cupertino_native: ^0.0.1
  flutter_sficon: ^1.3.0
  flutter_svg: ^2.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  super_drag_and_drop: ^0.9.1
  pdfx: ^2.9.2
  archive: ^4.0.9
  xml: ^6.0.0
  pdf: ^3.11.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  liquid_glass_easy: 5.0.0
  liquid_glass_easy_slider:
    path: packages/liquid_glass_easy
  flutter_onnxruntime: ^1.8.3
  tflite_flutter: ^0.12.1
  path_provider: ^2.1.0
  flutter_liquid_glass_widgets: ^0.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

dependency_overrides:
  # Android content providers may list a file's MIME type without exposing
  # its URI through super_native_extensions, which hides the original name.
  super_native_extensions:
    path: packages/super_native_extensions
  # Keep ONNX Runtime's Dart/iOS/macOS implementation, but do not expose the
  # plugin's Android implementation. Android uses tflite_flutter instead.
  flutter_onnxruntime:
    path: packages/flutter_onnxruntime
  # Keep TFLite's Android implementation, but do not expose its Apple native
  # implementations. iOS/macOS use flutter_onnxruntime instead.
  tflite_flutter:
    path: packages/tflite_flutter
  # Forward the built-in Light Mode shadow through GlassPopover's morph layer.
  flutter_liquid_glass_widgets:
    path: packages/flutter_liquid_glass_widgets

flutter:
  uses-material-design: true

  assets:
    - shorebird.yaml
    - assets/liquid_glass_background_light.webp
    - assets/liquid_glass_background_dark.webp
    - assets/fonts/
    - assets/icons/
    - assets/custom_icons/
    - assets/models/

  fonts:
    - family: SFProText
      fonts:
        - asset: assets/fonts/SF-Pro-Light.otf
          weight: 300
        - asset: assets/fonts/SF-Pro-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Heavy.otf
          weight: 800
